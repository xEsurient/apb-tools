<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>APB map viewer</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  body{display:flex;flex-direction:column;height:100vh}
  #wrap{flex:1;display:flex;min-height:0}
  #side{width:300px;overflow:auto;padding:10px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:6px}
  #side label{font-size:13px}
  #stage{flex:1;position:relative;min-width:0}
  #c2d,#c3d{position:absolute;inset:0;width:100%;height:100%}
  #c2d{cursor:crosshair}
  #mini{position:absolute;right:12px;bottom:12px;width:260px;height:260px;border:1px solid var(--line);background:#000a;display:none;cursor:pointer}
  #tip{position:absolute;display:none;background:#000c;padding:3px 6px;border-radius:3px;font-size:12px;pointer-events:none;white-space:nowrap}
  #help{position:absolute;left:12px;bottom:12px;font-size:12px;background:#000a;padding:6px 9px;border-radius:4px;display:none}
  #progress{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#000c;padding:6px 12px;border-radius:4px;display:none}
  #detail table td{font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis}
  .modes button.active{border-color:var(--acc);color:var(--acc)}
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
</head>
<body>
<header><h1>APB map viewer</h1><nav><a href="../">Home</a><a href="../config/">Config merge</a><a class="active" href="./">Map viewer</a></nav>
  <select id="district"></select>
  <span class="modes"><button data-mode="2d" class="active">2D map</button><button data-mode="3d">3D</button></span>
  <span id="v3btns" style="display:none"><button id="btop">Top view</button><button id="bover">Overview</button></span>
  <span id="status" class="dim"></span></header>
<div id="wrap">
  <aside id="side">
    <input id="search" placeholder="search name / label / class (Enter)">
    <div id="kinds"></div>
    <div id="detail" class="card"><span class="dim">Click an object for its details.</span></div>
    <p class="hint">2D: drag to pan, wheel to zoom. 3D: drag to look, WASD / arrows to move, Q / E down / up,
      Shift faster, wheel changes speed, click an object for details, click the minimap to jump there.</p>
  </aside>
  <div id="stage">
    <canvas id="c2d"></canvas><div id="c3d"></div><canvas id="mini" width="260" height="260"></canvas>
    <div id="tip"></div><div id="help"></div><div id="progress"></div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body></html>
