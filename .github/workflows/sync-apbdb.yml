name: DB Update APBDB

on:
  schedule:
    - cron: '0 20 * * 3'
  workflow_dispatch:
    inputs:
      force:
        description: 'Sync even if the APBDB version has not changed'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repo-data-commit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load the held data
        run: bash .github/scripts/data-load.sh designer/data.json
        env:
          DATA_BRANCH: ${{ vars.DATA_BRANCH }}
      - name: Pull APBDB data into designer/data.json
        run: node .github/scripts/sync-apbdb.mjs
        env:
          FORCE_SYNC: ${{ inputs.force }}
      - name: Commit the updated data
        run: |
          bash .github/scripts/data-commit.sh "Sync $(node -p "require('./designer/data.json').apbdb.version")" designer/data.json
        env:
          DATA_BRANCH: ${{ vars.DATA_BRANCH }}
          COMMIT_NAME: github-actions[bot]
          COMMIT_EMAIL: 138257050+xEsurient@users.noreply.github.com

  deploy:
    needs: sync
    if: vars.DATA_BRANCH != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
