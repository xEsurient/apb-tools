name: GeoGuesser daily schedule

on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Top the schedule up to 365 days even if it is still long enough'
        type: boolean
        default: false
      rebuild_from:
        description: 'Redo every day from this date on (YYYY-MM-DD, after today), e.g. after new spots or a district fix'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: repo-data-commit
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add the next days to maps/data/daily.json
        run: node .github/scripts/geo-daily.mjs
        env:
          FORCE_FILL: ${{ inputs.force }}
          REBUILD_FROM: ${{ inputs.rebuild_from }}
      - name: Commit the schedule
        run: |
          if git diff --quiet -- maps/data/daily.json && ! git ls-files --others --exclude-standard -- maps/data/daily.json | grep -q .; then echo "No schedule changes."; exit 0; fi
          git config user.name "GeoGuesser"
          git config user.email "138257050+xEsurient@users.noreply.github.com"
          git add maps/data/daily.json
          git commit -m "GeoGuesser: daily schedule up to $(node -p "Object.keys(require('./maps/data/daily.json').days).sort().at(-1)")"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
